// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories { google(); mavenCentral() }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories { google(); mavenCentral(); maven { url 'https://www.jitpack.io' } }
}

subprojects { subproject ->
  subproject.plugins.withId("com.android.library") {
    subproject.android.defaultConfig.externalNativeBuild.cmake.arguments(
      "-DCMAKE_ANDROID_STL_TYPE=c++_shared",
      "-DCMAKE_CXX_STANDARD_LIBRARIES=-lc++_shared -latomic -lm"
    )
  }
}

if ((findProperty("kicks.reuseVerifiedNativeLibraries") ?: "false").toBoolean()) {
  subprojects { subproject ->
    subproject.tasks.configureEach { task ->
      if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake") || task.name.startsWith("externalNativeBuild")) task.enabled = false
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
