name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile Android Kotlin
        run: gradle -p apps/mobile/android :app:compileDebugKotlin
      # Release bundles JavaScript, so this artifact does not require Metro.
      # No signing keys or collector credentials are read by this workflow.
      - name: Build unsigned internal-beta APK (ARM 32 and 64 bit)
        run: >-
          gradle -p apps/mobile/android :app:assembleRelease
          -Pkicks.unsignedRelease=true
          -Pkicks.collectorEnabled=true
          -Pkicks.collectorProvisioningEnabled=true
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          --max-workers=2 --console=plain
      - name: Audit merged release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-apk
          manifest="$(find apps/mobile/android/app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests)/release/' | head -n 1 || true)"
          test -n "$manifest"
          cp "$manifest" cloud-apk/AndroidManifest-merged-release.xml
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$manifest"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$manifest"
          ! grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' "$manifest"
          ! grep -q 'android.permission.VIBRATE' "$manifest"
          grep -q 'android.permission.BIND_VPN_SERVICE' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk cloud-apk/KICKS-0.2.6-internal-beta-ARM-unsigned.apk
          git rev-parse HEAD > cloud-apk/SOURCE_COMMIT.txt
          cd cloud-apk
          sha256sum KICKS-0.2.6-internal-beta-ARM-unsigned.apk > SHA256SUMS.txt
          printf '%s\n' \
            'KICKS 0.2.6 internal beta - UNSIGNED, NOT INSTALLABLE YET.' \
            'Package: com.datastorm.kicks; versionCode: 8.' \
            'ABIs: armeabi-v7a and arm64-v8a; JavaScript is bundled.' \
            'Collector and ADB provisioning support compiled in; runtime consent and VPN authorization still required.' \
            'Merged release AndroidManifest.xml is included for privacy/permission audit evidence.' \
            'Sign with the existing installation key and verify the installed certificate before upgrading.' \
            'Never uninstall or clear app data to resolve a signature mismatch.' \
            'No device data or signing keys are included.' \
            'Artifacts expire after 14 days; this is not permanent backup storage.' > README.txt
      - name: Upload internal-beta APK
        uses: actions/upload-artifact@v4
        with:
          name: KICKS-0.2.6-ARM-unsigned-${{ github.run_number }}
          path: cloud-apk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
