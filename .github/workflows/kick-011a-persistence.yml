name: KICK-011A Persistence Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kicks_test
          POSTGRES_PASSWORD: kicks_test
          POSTGRES_DB: kicks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicks_test -d kicks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KICKS_TEST_DATABASE_URL: postgres://kicks_test:kicks_test@localhost:5432/kicks_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck --workspace @kicks/api
      - name: Build web assets required by API route tests
        run: npm run build:web --workspace @kicks/mobile
      - name: Run API unit and PostgreSQL integration tests
        run: npm run test --workspace @kicks/api

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Assemble Android debug build
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
