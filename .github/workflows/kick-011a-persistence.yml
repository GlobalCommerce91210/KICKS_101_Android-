name: KICK-011A Persistence Gates

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/kick-011a-persistence.yml"
      - "package.json"
  push:
    branches:
      - "codex/kick-011a-secure-consent-decisions"
    paths:
      - "services/api/**"
      - ".github/workflows/kick-011a-persistence.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  api-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kicks_test
          POSTGRES_PASSWORD: kicks_test
          POSTGRES_DB: kicks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicks_test -d kicks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KICKS_TEST_DATABASE_URL: postgres://kicks_test:kicks_test@localhost:5432/kicks_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install --ignore-scripts
      - name: Typecheck API
        run: npm run typecheck --workspace @kicks/api
      - name: Run API unit and PostgreSQL integration tests
        run: npm run test --workspace @kicks/api
