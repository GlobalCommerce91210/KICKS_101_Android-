name: postgres-account-consent
on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'apps/mobile/services/sessionCore.ts'
      - 'package-lock.json'
      - '.github/workflows/postgres-account-consent.yml'
permissions:
  contents: read
jobs:
  restart-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kicks_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: kicks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kicks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @kicks/api
      - name: Validate migration and restart contract against PostgreSQL
        run: node --import tsx --test services/api/src/postgres-account-consent.test.ts
        env:
          NODE_ENV: test
          KICKS_TEST_DATABASE_URL: postgresql://kicks_test:synthetic_ci_only@127.0.0.1:5432/kicks_test
